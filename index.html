<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="漫画本棚" />
<meta name="theme-color" content="#0F1115" />
<title>漫画本棚 - コレクション管理</title>
<style>
:root {
  --bg: #0f1115;
  --surface: #181b22;
  --surface-2: #222631;
  --border: #2c313f;
  --text: #f3f4f6;
  --text-sub: #9ca3af;
  --accent: #f97316;
  --accent-dim: rgba(249, 115, 22, 0.16);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.16);
  --red-text: #fca5a5;
  --blue: #3b82f6;
  --blue-bg: rgba(59, 130, 246, 0.16);
  --blue-text: #93c5fd;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.16);
  --green-text: #6ee7b7;
  --purple: #a855f7;
  --purple-bg: rgba(168, 85, 247, 0.16);
  --purple-text: #d8b4fe;
  --teal: #14b8a6;
  --teal-bg: rgba(20, 184, 166, 0.16);
  --teal-text: #5eead4;
  --gray-bg: rgba(156, 163, 175, 0.14);
  --gray-text: #d1d5db;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
  min-height: 100vh;
  overscroll-behavior-y: none;
}
body.modal-open {
  overflow: hidden;
}

/* Header */
.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(15, 17, 21, 0.94);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: calc(10px + var(--safe-top)) 14px 10px;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.app-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.app-title-badge {
  font-size: 11px;
  font-weight: 700;
  background: var(--accent-dim);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 999px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  height: 38px;
  padding: 0 11px;
  font-size: 13px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:active {
  transform: scale(0.97);
}
.icon-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* Search & Controls */
.search-wrap {
  position: relative;
  margin-bottom: 8px;
}
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 34px 10px 34px;
  font-size: 15px;
  outline: none;
}
.search-input:focus {
  border-color: var(--accent);
}
.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-sub);
  font-size: 14px;
  pointer-events: none;
}
.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--surface-2);
  border: none;
  color: var(--text-sub);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  font-size: 12px;
  cursor: pointer;
  display: none;
}
.search-clear.visible {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.control-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.select-box {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 600;
  outline: none;
}
.chips-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 7px 0 1px;
  scrollbar-width: none;
}
.chips-scroll::-webkit-scrollbar {
  display: none;
}
.chip {
  flex: 0 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-sub);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.kana-chip.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

/* Summary Strip */
.summary-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 12px;
  padding: 8px 14px;
  font-size: 12px;
  color: var(--text-sub);
  border-bottom: 1px solid var(--border);
  background: #13161c;
}
.summary-bar strong {
  color: var(--text);
}

/* Book List */
.book-list {
  padding: 10px 12px calc(36px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 9px;
  max-width: 760px;
  margin: 0 auto;
}
.book-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.book-card:active {
  background: var(--surface-2);
  border-color: #3f4659;
}
.book-main {
  min-width: 0;
  flex: 1;
}
.book-meta-top {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 5px;
}
.tag {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  line-height: 1.3;
}
.tag-status-end {
  background: var(--gray-bg);
  color: var(--gray-text);
}
.tag-status-on {
  background: var(--accent-dim);
  color: #fdba74;
}
.tag-owned-missing {
  background: var(--red-bg);
  color: var(--red-text);
}
.tag-owned-unstarted {
  background: rgba(107, 114, 128, 0.22);
  color: #9ca3af;
}
.tag-owned-uptodate {
  background: var(--blue-bg);
  color: var(--blue-text);
}
.tag-owned-complete {
  background: var(--green-bg);
  color: var(--green-text);
}
.tag-vol0 {
  background: var(--purple-bg);
  color: var(--purple-text);
}
.tag-spin {
  background: var(--teal-bg);
  color: var(--teal-text);
}
.book-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.35;
  word-break: break-word;
}
.book-counts {
  font-size: 13px;
  color: var(--text-sub);
  font-weight: 600;
}
.book-missing-line {
  margin-top: 5px;
  font-size: 12px;
  font-weight: 700;
  color: var(--red-text);
  background: rgba(239, 68, 68, 0.09);
  border: 1px solid rgba(239, 68, 68, 0.24);
  border-radius: 8px;
  padding: 4px 8px;
  display: inline-block;
  max-width: 100%;
  word-break: break-word;
}
.book-chevron {
  color: var(--text-sub);
  font-size: 18px;
  flex-shrink: 0;
}

/* Detail / Edit Modal Sheet */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0, 0, 0, 0.78);
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-backdrop.open {
  display: flex;
}
.modal-sheet {
  background: var(--bg);
  width: 100%;
  max-width: 760px;
  height: 100dvh;
  max-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  flex-shrink: 0;
  padding: calc(10px + var(--safe-top)) 14px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  z-index: 10;
}
.modal-header-title {
  font-size: 15px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
  flex: 1;
}
.modal-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px calc(36px + var(--safe-bottom));
}

/* Form in Detail */
.field-group {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
}
.field-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 12px;
}
.field-row:last-child {
  margin-bottom: 0;
}
.field-row-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.field-label-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.field-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-sub);
}
.mini-action-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--accent);
  border-radius: 7px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.text-input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 11px;
  font-size: 15px;
  outline: none;
}
.text-input:focus {
  border-color: var(--accent);
}
.stepper-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stepper-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  flex-shrink: 0;
}
.stepper-btn:active {
  background: var(--accent);
  border-color: var(--accent);
}

/* Batch / Range Tool Box */
.batch-box {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  margin-top: 10px;
}
.batch-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 8px;
}
.range-inputs {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.range-num {
  width: 72px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 8px;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
}
.range-sep {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sub);
}

/* Quick Actions & Volume Grid */
.detail-status-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
}
.quick-btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.quick-btn {
  flex: 1;
  min-width: 110px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.quick-btn.all-on {
  background: var(--blue-bg);
  border-color: rgba(59, 130, 246, 0.45);
  color: var(--blue-text);
}
.quick-btn.all-off {
  background: var(--red-bg);
  border-color: rgba(239, 68, 68, 0.35);
  color: var(--red-text);
}
.vol-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 14px 0 8px;
  font-size: 13px;
  font-weight: 800;
  color: var(--text-sub);
}
.vol-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
}
@media (min-width: 520px) {
  .vol-grid {
    grid-template-columns: repeat(8, 1fr);
  }
}
.vol-tile {
  height: 46px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  transition: transform 0.08s ease;
}
.vol-tile:active {
  transform: scale(0.94);
}
.vol-tile.missing {
  background: var(--red-bg);
  border-color: rgba(239, 68, 68, 0.45);
  color: var(--red-text);
}
.vol-tile.owned {
  background: var(--blue-bg);
  border-color: rgba(59, 130, 246, 0.55);
  color: var(--blue-text);
}
.vol-tile.vol0-tile.missing {
  background: var(--purple-bg);
  border-color: rgba(168, 85, 247, 0.45);
  color: var(--purple-text);
}
.vol-tile.vol0-tile.owned {
  background: rgba(168, 85, 247, 0.34);
  border-color: rgba(192, 132, 252, 0.75);
  color: #f3e8ff;
}
.vol-tile.spin-tile.missing {
  background: var(--teal-bg);
  border-color: rgba(20, 184, 166, 0.45);
  color: var(--teal-text);
}
.vol-tile.spin-tile.owned {
  background: rgba(20, 184, 166, 0.32);
  border-color: rgba(94, 234, 212, 0.75);
  color: #ccfbf1;
}

/* Optional Vol0 & Spinoff Cards */
.extra-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  margin-top: 12px;
}
.extra-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.extra-card-title {
  font-size: 14px;
  font-weight: 800;
}
.extra-card-sub {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 2px;
}
.sub-action-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.sub-action-btn.purple {
  color: var(--purple-text);
  border-color: rgba(168, 85, 247, 0.4);
  background: var(--purple-bg);
}
.sub-action-btn.danger-sm {
  color: var(--red-text);
  border-color: rgba(239, 68, 68, 0.35);
  background: var(--red-bg);
}

/* Backup Modal */
.backup-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.backup-box h3 {
  margin: 0 0 6px;
  font-size: 15px;
}
.backup-box p {
  margin: 0 0 12px;
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.5;
}
.danger-btn {
  background: var(--red-bg);
  border: 1px solid rgba(239, 68, 68, 0.45);
  color: var(--red-text);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 13px;
  font-weight: 800;
  width: 100%;
  cursor: pointer;
  margin-top: 18px;
}
.empty-state {
  text-align: center;
  padding: 48px 16px;
  color: var(--text-sub);
  font-size: 14px;
}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-top">
    <div class="app-title">
      <span>📚 本棚</span>
      <span class="app-title-badge" id="totalCountBadge">0作品</span>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="openBackupBtn" title="保存・復元">⚙ 保存/復元</button>
      <button type="button" class="icon-btn primary" id="addBookBtn">＋ 追加</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="searchInput" class="search-input" placeholder="タイトル・読みがなで検索..." autocomplete="off" />
    <button type="button" id="searchClearBtn" class="search-clear">✕</button>
  </div>
  <div class="control-row">
    <select id="sortSelect" class="select-box" aria-label="並び替え">
      <option value="kana">50音順</option>
      <option value="complete_owned_first">完結（1巻以上所持を優先）</option>
      <option value="complete_all">完結</option>
      <option value="missing_partial_first">優先</option>
      <option value="missing_count_desc">未所持巻数が多い順</option>
      <option value="owned_count_desc">所持巻数が多い順</option>
    </select>
  </div>
  <div class="chips-scroll" id="filterChips">
    <button type="button" class="chip active" data-filter="all">すべて</button>
    <button type="button" class="chip" data-filter="complete_missing">完結（未所持あり）</button>
    <button type="button" class="chip" data-filter="complete_all">完結</button>
    <button type="button" class="chip" data-filter="ongoing_missing">未所持あり</button>
    <button type="button" class="chip" data-filter="unstarted">未購入</button>
    <button type="button" class="chip" data-filter="ongoing">連載中</button>
    <button type="button" class="chip" data-filter="comp">コンプ</button>
  </div>
  <div class="chips-scroll" id="kanaChips" aria-label="頭文字絞り込み">
    <button type="button" class="chip kana-chip active" data-kana="all">頭文字：すべて</button>
    <button type="button" class="chip kana-chip" data-kana="a">あ</button>
    <button type="button" class="chip kana-chip" data-kana="k">か</button>
    <button type="button" class="chip kana-chip" data-kana="s">さ</button>
    <button type="button" class="chip kana-chip" data-kana="t">た</button>
    <button type="button" class="chip kana-chip" data-kana="n">な</button>
    <button type="button" class="chip kana-chip" data-kana="h">は</button>
    <button type="button" class="chip kana-chip" data-kana="m">ま</button>
    <button type="button" class="chip kana-chip" data-kana="y">や</button>
    <button type="button" class="chip kana-chip" data-kana="r">ら</button>
    <button type="button" class="chip kana-chip" data-kana="w">わ</button>
  </div>
</header>

<div class="summary-bar" id="summaryBar">
  <span>表示中: <strong id="visibleCount">0</strong>作品</span>
  <span>所持タイトル: <strong id="ownedTitleCount">0</strong>作品</span>
  <span>総所持: <strong id="totalOwnedVols">0</strong>冊</span>
</div>

<main class="book-list" id="bookList"></main>

<!-- Detail / Edit Modal -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal-sheet">
    <div class="modal-header">
      <button type="button" class="icon-btn" id="closeDetailBtn">← 戻る</button>
      <div class="modal-header-title" id="detailHeaderTitle">作品詳細</div>
      <button type="button" class="icon-btn primary" id="saveDetailBtn">完了</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<!-- Backup / Data Modal -->
<div class="modal-backdrop" id="backupModal">
  <div class="modal-sheet" style="height: 85dvh; border-top-left-radius: 20px; border-top-right-radius: 20px; border-top: 1px solid var(--border);">
    <div class="modal-header">
      <button type="button" class="icon-btn" id="closeBackupBtn">← 閉じる</button>
      <div class="modal-header-title">保存・復元</div>
      <div style="width: 60px;"></div>
    </div>
    <div class="modal-body">
      <div class="backup-box">
        <h3>📥 バックアップを保存（JSON）</h3>
        <p>現在の本棚データをファイルとして保存します。ブラウザの履歴やデータを消す前の控えとして使えます。</p>
        <button type="button" class="icon-btn primary" style="width:100%; height:42px;" id="exportJsonBtn">バックアップファイルをダウンロード</button>
      </div>
      <div class="backup-box">

function normalizeBook(raw) {

  const owned = Array.isArray(raw.owned)
    ? Array.from(new Set(raw.owned.map(Number).filter(v => Number.isInteger(v) && v >= 1 && v <= MAX_VOL))).sort((a, b) => a - b)

  const vol0Owned = hasVol0 ? Boolean(raw.vol0Owned) : false;

  const spinoffTotal = Math.min(100, Math.max(0, Number(raw.spinoffTotal) || 0));
  const spinoffOwned = Array.isArray(raw.spinoffOwned)
    ? Array.from(new Set(raw.spinoffOwned.map(Number).filter(v => Number.isInteger(v) && v >= 1 && v <= spinoffTotal))).sort((a, b) => a - b)
    : [];

  return {
    id: Number(raw.id) || 1,
    title: String(raw.title || ""),
    yomi: String(raw.yomi || ""),
    status: raw.status === "完結" ? "完結" : "連載中",
    latest,
    owned,
    hasVol0,
    vol0Owned,
    spinoffTotal,
    spinoffOwned
  };
}

  } catch (e) {
    console.warn("localStorage read fallback:", e);
  }
  return cloneInitialBooks();
}

function toHiraganaFirstChar(str) {
  const s = (str || "").trim();
  if (!s) return "";
  const ch = s[0];
  const code = ch.charCodeAt(0);
  if (code >= 0x30A1 && code <= 0x30F6) {
    return String.fromCharCode(code - 0x60);
  }
  return ch;
}

  const groups = {
    a: ["あ", "い", "う", "え", "お", "ぁ", "ぃ", "ぅ", "ぇ", "ぉ"],
    k: ["か", "き", "く", "け", "こ", "が", "ぎ", "ぐ", "げ", "ご"],

    m: ["ま", "み", "む", "め", "も"],
    y: ["や", "ゆ", "よ", "ゃ", "ゅ", "ょ"],
    r: ["ら", "り", "る", "れ", "ろ"],
    w: ["わ", "を", "ん"]
  };
  const targets = groups[group] || [];
  return targets.includes(first);
}

function formatMissingRanges(book) {
  const ownedSet = new Set(book.owned || []);
  const missing = [];
  for (let v = 1; v <= book.latest; v++) {
    if (!ownedSet.has(v)) missing.push(v);
  }
  if (missing.length === 0) return "";
  const ranges = [];
  let start = missing[0];
  let prev = missing[0];
  for (let i = 1; i < missing.length; i++) {
    const cur = missing[i];
    if (cur === prev + 1) {
      prev = cur;
    } else {
      ranges.push(start === prev ? `${start}` : `${start}～${prev}`);
      start = cur;
      prev = cur;
    }
  }
  ranges.push(start === prev ? `${start}` : `${start}～${prev}`);
  return ranges.join(", ") + "巻";
}

function getMainOwnedCount(book) {
  if (!book.owned) return 0;
  return book.owned.filter(v => v >= 1 && v <= MAX_VOL).length;
}

function getVol0OwnedCount(book) {
  return (book.hasVol0 && book.vol0Owned) ? 1 : 0;
}

function getSpinoffOwnedCount(book) {
  const total = Number(book.spinoffTotal) || 0;
  if (total <= 0 || !Array.isArray(book.spinoffOwned)) return 0;
  return book.spinoffOwned.filter(v => v >= 1 && v <= total).length;
}

function getTotalOwnedCount(book) {
  return getMainOwnedCount(book) + getVol0OwnedCount(book) + getSpinoffOwnedCount(book);
}

function hasAnyOwnedTitle(book) {
  return getTotalOwnedCount(book) > 0;
}

function getDerivedStatus(book) {
  const ownedCount = getMainOwnedCount(book);
  const missingCount = Math.max(0, book.latest - ownedCount);
  if (missingCount > 0) {
    return ownedCount > 0 ? "未所持あり" : "未購入";
  }
  return book.status === "連載中" ? "既刊まで所持" : "コンプ";
}

  const ka = (a.yomi || a.title || "").trim();
  const kb = (b.yomi || b.title || "").trim();
  return ka.localeCompare(kb, "ja");

      const tb = getTotalOwnedCount(b);
      if (tb !== ta) return tb - ta;
      return compareKana(a, b);
    }
    return compareKana(a, b);
  });
  return list;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderList() {
  const list = getFilteredAndSortedBooks();
  const container = document.getElementById("bookList");
  document.getElementById("totalCountBadge").textContent = `${books.length}作品`;
  document.getElementById("visibleCount").textContent = list.length;

  const ownedTitles = books.filter(b => hasAnyOwnedTitle(b)).length;
  document.getElementById("ownedTitleCount").textContent = ownedTitles.toLocaleString();

  const totalVols = books.reduce((sum, b) => sum + getTotalOwnedCount(b), 0);
  document.getElementById("totalOwnedVols").textContent = totalVols.toLocaleString();

  if (list.length === 0) {
    container.innerHTML = `<div class="empty-state">条件に一致する作品がありません</div>`;
    return;
  }

  container.innerHTML = list.map(book => {
    const mainOwned = getMainOwnedCount(book);
    const spinTotal = Number(book.spinoffTotal) || 0;
    const spinOwned = getSpinoffOwnedCount(book);
    const derived = getDerivedStatus(book);
    const missingText = formatMissingRanges(book);
    const statusTagClass = book.status === "完結" ? "tag-status-end" : "tag-status-on";
    let derivedClass = "tag-owned-complete";
    if (derived === "未所持あり") derivedClass = "tag-owned-missing";
    else if (derived === "未購入") derivedClass = "tag-owned-unstarted";
    else if (derived === "既刊まで所持") derivedClass = "tag-owned-uptodate";

    const vol0Badge = book.hasVol0
      ? `<span class="tag tag-vol0">${book.vol0Owned ? "0巻所持" : "0巻あり"}</span>`
      : "";
    const spinBadge = spinTotal > 0
      ? `<span class="tag tag-spin">番外編 ${spinOwned}/${spinTotal}</span>`
      : "";
    const missingLine = missingText
      ? `<div class="book-missing-line">未所持：${escapeHtml(missingText)}</div>`
      : "";

    const extraCountNote = (book.vol0Owned || spinOwned > 0)
      ? `（計${getTotalOwnedCount(book)}冊）`
      : "";

    return `
      <article class="book-card" data-id="${book.id}">
        <div class="book-main">
          <div class="book-meta-top">
            <span class="tag ${statusTagClass}">${escapeHtml(book.status)}</span>
            <span class="tag ${derivedClass}">${escapeHtml(derived)}</span>
            ${vol0Badge}
            ${spinBadge}
          </div>
          <div class="book-title">${escapeHtml(book.title)}</div>
          <div class="book-counts">既刊${book.latest}巻 / 所持${mainOwned}巻${extraCountNote}</div>
          ${missingLine}
        </div>
        <div class="book-chevron">›</div>
      </article>
    `;
  }).join("");

  container.querySelectorAll(".book-card").forEach(card => {
    card.addEventListener("click", () => {
      const id = Number(card.getAttribute("data-id"));
      openDetailModal(id);
    });
  });
}

function openDetailModal(bookId) {
  editingBookId = bookId;
  if (bookId === null) {
    const maxId = books.reduce((m, b) => Math.max(m, b.id), 0);
    draftBook = normalizeBook({
      id: maxId + 1,
      title: "",
      yomi: "",
      status: "連載中",
      latest: 1,
      owned: [],
      hasVol0: false,
      vol0Owned: false,
      spinoffTotal: 0,
      spinoffOwned: []
    });
    document.getElementById("detailHeaderTitle").textContent = "新しい作品を追加";
  } else {
    const orig = books.find(b => b.id === bookId);
    if (!orig) return;
    draftBook = normalizeBook(orig);
    document.getElementById("detailHeaderTitle").textContent = draftBook.title || "作品詳細";
  }
  renderDetailBody();
  document.getElementById("detailBody").scrollTop = 0;
  document.getElementById("detailModal").classList.add("open");
  document.body.classList.add("modal-open");
}

function applyRangeOwned(fromVol, toVol, shouldOwn) {
  const maxV = Math.min(MAX_VOL, Math.max(0, Number(draftBook.latest) || 0));
  let a = parseInt(fromVol, 10);
  let b = parseInt(toVol, 10);
  if (isNaN(a)) a = 1;
  if (isNaN(b)) b = maxV;
  a = Math.max(1, Math.min(maxV, a));
  b = Math.max(1, Math.min(maxV, b));
  if (a > b) {
    const tmp = a;
    a = b;
    b = tmp;
  }
  const set = new Set(draftBook.owned || []);
  for (let v = a; v <= b; v++) {
    if (shouldOwn) set.add(v);
    else set.delete(v);
  }
  draftBook.owned = Array.from(set).sort((x, y) => x - y);
}

function renderDetailBody() {
  const body = document.getElementById("detailBody");
  const prevScroll = body.scrollTop;
  const ownedSet = new Set(draftBook.owned || []);
  const mainOwnedCount = getMainOwnedCount(draftBook);
  const totalOwnedCount = getTotalOwnedCount(draftBook);
  const derived = getDerivedStatus(draftBook);
  const missingText = formatMissingRanges(draftBook);

  let derivedClass = "tag-owned-complete";
  if (derived === "未所持あり") derivedClass = "tag-owned-missing";
  else if (derived === "未購入") derivedClass = "tag-owned-unstarted";
  else if (derived === "既刊まで所持") derivedClass = "tag-owned-uptodate";

  const maxGridVol = Math.min(MAX_VOL, Math.max(0, Number(draftBook.latest) || 0));
  let tilesHtml = "";
  for (let v = 1; v <= maxGridVol; v++) {
    const isOwned = ownedSet.has(v);
    tilesHtml += `<div class="vol-tile ${isOwned ? "owned" : "missing"}" data-vol="${v}">${v}</div>`;
  }

  let vol0SectionHtml = "";
  if (draftBook.hasVol0) {
    vol0SectionHtml = `
      <div class="extra-card">
        <div class="extra-card-head">
          <div>
            <div class="extra-card-title">0巻</div>
            <div class="extra-card-sub">タップで所持/未所持を切替</div>
          </div>
          <button type="button" class="sub-action-btn danger-sm" id="removeVol0Btn">0巻を削除</button>
        </div>
        <div class="vol-grid" style="margin-top:10px;">
          <div class="vol-tile vol0-tile ${draftBook.vol0Owned ? "owned" : "missing"}" id="vol0TileBtn">0巻</div>
        </div>
      </div>
    `;
  } else {
    vol0SectionHtml = `
      <div class="extra-card">
        <div class="extra-card-head">
          <div>
            <div class="extra-card-title">0巻の追加</div>
            <div class="extra-card-sub">0巻がある作品だけ追加できます</div>
          </div>
          <button type="button" class="sub-action-btn purple" id="addVol0Btn">＋ 0巻を追加</button>
        </div>
      </div>
    `;
  }

  const spinTotal = Number(draftBook.spinoffTotal) || 0;
  const spinOwnedSet = new Set(draftBook.spinoffOwned || []);
  let spinTilesHtml = "";
  for (let s = 1; s <= spinTotal; s++) {
    const isSpinOwned = spinOwnedSet.has(s);
    spinTilesHtml += `<div class="vol-tile spin-tile ${isSpinOwned ? "owned" : "missing"}" data-spin="${s}">外${s}</div>`;
  }

  const spinoffSectionHtml = `
    <div class="extra-card">
      <div class="extra-card-head">
        <div>
          <div class="extra-card-title">番外編</div>
          <div class="extra-card-sub">巻数を設定すると各巻をタップで管理できます</div>
        </div>
        <div class="stepper-wrap">
          <button type="button" class="stepper-btn" id="spinMinusBtn">－</button>
          <input type="number" id="editSpinTotal" class="range-num" style="width:58px; height:40px;" min="0" max="100" value="${spinTotal}" />
          <button type="button" class="stepper-btn" id="spinPlusBtn">＋</button>
        </div>
      </div>
      ${spinTotal > 0 ? `
        <div class="vol-section-header" style="margin-top:10px;">
          <span>番外編 所持：${getSpinoffOwnedCount(draftBook)} / ${spinTotal}巻</span>
          <span>外1〜外${spinTotal}</span>
        </div>
        <div class="vol-grid">${spinTilesHtml}</div>
      ` : ""}
    </div>
  `;

  body.innerHTML = `
    <div class="field-group">
      <div class="field-row">
        <label class="field-label">タイトル</label>
        <input type="text" id="editTitle" class="text-input" value="${escapeHtml(draftBook.title)}" placeholder="例：呪術廻戦" />
      </div>
      <div class="field-row">
        <div class="field-label-line">
          <label class="field-label">読みがな</label>
          <button type="button" class="mini-action-btn" id="copyTitleToYomiBtn">タイトルをコピー</button>
        </div>
        <input type="text" id="editYomi" class="text-input" value="${escapeHtml(draftBook.yomi)}" placeholder="例：じゅじゅつかいせん" />
      </div>
      <div class="field-row-2col">
        <div class="field-row">
          <label class="field-label">状態</label>
          <select id="editStatus" class="text-input" style="height:42px;">
            <option value="連載中" ${draftBook.status === "連載中" ? "selected" : ""}>連載中</option>
            <option value="完結" ${draftBook.status === "完結" ? "selected" : ""}>完結</option>
          </select>
        </div>
        <div class="field-row">
          <label class="field-label">既刊数</label>
          <div class="stepper-wrap">
            <button type="button" class="stepper-btn" id="latestMinusBtn">－</button>
            <input type="number" id="editLatest" class="text-input" min="0" max="${MAX_VOL}" value="${draftBook.latest}" style="text-align:center; font-weight:800;" />
            <button type="button" class="stepper-btn" id="latestPlusBtn">＋</button>
          </div>
        </div>
      </div>
    </div>

    <div class="detail-status-card">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;">
        <div>
          <span class="tag ${derivedClass}">${escapeHtml(derived)}</span>
          <strong style="margin-left:6px; font-size:15px;">既刊${draftBook.latest}巻 / 所持${mainOwnedCount}巻</strong>
        </div>
        <span style="font-size:12px; color:var(--text-sub); font-weight:700;">合計所持：${totalOwnedCount}冊</span>
      </div>
      ${missingText ? `<div class="book-missing-line" style="margin-top:8px;">未所持：${escapeHtml(missingText)}</div>` : ""}
      <div class="quick-btn-row">
        <button type="button" class="quick-btn all-on" id="ownAllBtn">既刊まで一括所持</button>
        <button type="button" class="quick-btn all-off" id="clearAllBtn">すべて未所持</button>
      </div>
      <div class="batch-box">
        <div class="batch-title">範囲指定でまとめて所持 / 未所持</div>
        <div class="range-inputs">
          <input type="number" id="rangeFrom" class="range-num" min="1" max="${Math.max(1, maxGridVol)}" value="1" />
          <span class="range-sep">巻 ～</span>
          <input type="number" id="rangeTo" class="range-num" min="1" max="${Math.max(1, maxGridVol)}" value="${Math.max(1, maxGridVol)}" />
          <span class="range-sep">巻</span>
        </div>
        <div class="quick-btn-row" style="margin-top:0;">
          <button type="button" class="quick-btn all-on" id="applyRangeOnBtn">所持</button>
          <button type="button" class="quick-btn all-off" id="applyRangeOffBtn">未所持</button>
        </div>
      </div>
    </div>

    <div class="vol-section-header">
      <span>各巻の所持状況</span>
    </div>
    <div class="vol-grid" id="volGrid">${tilesHtml}</div>

    ${vol0SectionHtml}
    ${spinoffSectionHtml}

    ${editingBookId !== null ? `<button type="button" class="danger-btn" id="deleteBookBtn">この作品を本棚から削除</button>` : ""}
  `;

  body.scrollTop = prevScroll;

  document.getElementById("editTitle").addEventListener("input", e => {
    draftBook.title = e.target.value;
    document.getElementById("detailHeaderTitle").textContent = draftBook.title || "作品詳細";
    if (draftBook.title.trim()) autoSaveDraftIfExisting();
  });

  document.getElementById("copyTitleToYomiBtn").addEventListener("click", () => {
    draftBook.yomi = draftBook.title;
    document.getElementById("editYomi").value = draftBook.yomi;
    autoSaveDraftIfExisting();
  });

  document.getElementById("editYomi").addEventListener("input", e => {
    draftBook.yomi = e.target.value;
    autoSaveDraftIfExisting();
  });

  document.getElementById("editStatus").addEventListener("change", e => {
    draftBook.status = e.target.value;
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("editLatest").addEventListener("change", e => {
    let val = parseInt(e.target.value, 10);
    if (isNaN(val) || val < 0) val = 0;
    if (val > MAX_VOL) val = MAX_VOL;
    draftBook.latest = val;
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("latestMinusBtn").addEventListener("click", () => {
    draftBook.latest = Math.max(0, (Number(draftBook.latest) || 0) - 1);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("latestPlusBtn").addEventListener("click", () => {
    draftBook.latest = Math.min(MAX_VOL, (Number(draftBook.latest) || 0) + 1);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("ownAllBtn").addEventListener("click", () => {
    const all = [];
    for (let v = 1; v <= draftBook.latest; v++) all.push(v);
    draftBook.owned = all;
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("clearAllBtn").addEventListener("click", () => {
    draftBook.owned = [];
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("applyRangeOnBtn").addEventListener("click", () => {
    const f = document.getElementById("rangeFrom").value;
    const t = document.getElementById("rangeTo").value;
    applyRangeOwned(f, t, true);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("applyRangeOffBtn").addEventListener("click", () => {
    const f = document.getElementById("rangeFrom").value;
    const t = document.getElementById("rangeTo").value;
    applyRangeOwned(f, t, false);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  body.querySelectorAll(".vol-tile[data-vol]").forEach(tile => {
    tile.addEventListener("click", () => {
      const vol = Number(tile.getAttribute("data-vol"));
      const set = new Set(draftBook.owned || []);
      if (set.has(vol)) set.delete(vol);
      else set.add(vol);
      draftBook.owned = Array.from(set).sort((a, b) => a - b);
      autoSaveDraftIfExisting();
      renderDetailBody();
    });
  });

  const addVol0Btn = document.getElementById("addVol0Btn");
  if (addVol0Btn) {
    addVol0Btn.addEventListener("click", () => {
      draftBook.hasVol0 = true;
      draftBook.vol0Owned = true;
      autoSaveDraftIfExisting();
      renderDetailBody();
    });
  }

  const removeVol0Btn = document.getElementById("removeVol0Btn");
  if (removeVol0Btn) {
    removeVol0Btn.addEventListener("click", () => {
      draftBook.hasVol0 = false;
      draftBook.vol0Owned = false;
      autoSaveDraftIfExisting();
      renderDetailBody();
    });
  }

  const vol0TileBtn = document.getElementById("vol0TileBtn");
  if (vol0TileBtn) {
    vol0TileBtn.addEventListener("click", () => {
      draftBook.vol0Owned = !draftBook.vol0Owned;
      autoSaveDraftIfExisting();
      renderDetailBody();
    });
  }

  document.getElementById("editSpinTotal").addEventListener("change", e => {
    let val = parseInt(e.target.value, 10);
    if (isNaN(val) || val < 0) val = 0;
    if (val > 100) val = 100;
    draftBook.spinoffTotal = val;
    draftBook.spinoffOwned = (draftBook.spinoffOwned || []).filter(v => v <= val);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("spinMinusBtn").addEventListener("click", () => {
    const nextVal = Math.max(0, (Number(draftBook.spinoffTotal) || 0) - 1);
    draftBook.spinoffTotal = nextVal;
    draftBook.spinoffOwned = (draftBook.spinoffOwned || []).filter(v => v <= nextVal);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("spinPlusBtn").addEventListener("click", () => {
    const nextVal = Math.min(100, (Number(draftBook.spinoffTotal) || 0) + 1);
    draftBook.spinoffTotal = nextVal;
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  body.querySelectorAll(".vol-tile[data-spin]").forEach(tile => {
    tile.addEventListener("click", () => {
      const sVol = Number(tile.getAttribute("data-spin"));
      const set = new Set(draftBook.spinoffOwned || []);
      if (set.has(sVol)) set.delete(sVol);
      else set.add(sVol);
      draftBook.spinoffOwned = Array.from(set).sort((a, b) => a - b);
      autoSaveDraftIfExisting();
      renderDetailBody();
    });
  });

  const delBtn = document.getElementById("deleteBookBtn");
  if (delBtn) {
    delBtn.addEventListener("click", () => {
      if (confirm(`本当に「${draftBook.title}」を本棚から削除しますか？`)) {
        books = books.filter(b => b.id !== editingBookId);
        saveBooks(books);
        closeDetailModal();
        renderList();
      }
    });
  }
}

function closeDetailModal() {
  document.getElementById("detailModal").classList.remove("open");
  document.body.classList.remove("modal-open");
  editingBookId = null;
  draftBook = null;
}

document.getElementById("closeDetailBtn").addEventListener("click", closeDetailModal);

document.getElementById("detailModal").addEventListener("click", e => {
  if (e.target.id === "detailModal") closeDetailModal();
});

document.getElementById("saveDetailBtn").addEventListener("click", () => {
  if (!draftBook) return;
  if (!draftBook.title.trim()) {
    alert("タイトルを入力してください。");
    return;
  }
  draftBook = normalizeBook({
    ...draftBook,
    title: draftBook.title.trim(),
    yomi: (draftBook.yomi || "").trim()
  });
  if (editingBookId === null) {
    books.push(draftBook);
  } else {
    const idx = books.findIndex(b => b.id === editingBookId);
    if (idx !== -1) books[idx] = draftBook;
  }
  saveBooks(books);
  closeDetailModal();
  renderList();
});

// Search, Sort, Filter, Kana events
const searchInput = document.getElementById("searchInput");
const searchClearBtn = document.getElementById("searchClearBtn");
searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value;
  searchClearBtn.classList.toggle("visible", searchQuery.length > 0);
  renderList();
});
searchClearBtn.addEventListener("click", () => {
  searchQuery = "";
  searchInput.value = "";
  searchClearBtn.classList.remove("visible");
  renderList();
});
document.getElementById("sortSelect").addEventListener("change", e => {
  currentSort = e.target.value;
  renderList();
});
document.getElementById("filterChips").querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.getElementById("filterChips").querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentFilter = chip.getAttribute("data-filter");
    renderList();
  });
});
document.getElementById("kanaChips").querySelectorAll(".kana-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.getElementById("kanaChips").querySelectorAll(".kana-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentKana = chip.getAttribute("data-kana");
    renderList();
  });
});

document.getElementById("addBookBtn").addEventListener("click", () => openDetailModal(null));

// Backup modal
document.getElementById("openBackupBtn").addEventListener("click", () => {
  document.getElementById("backupModal").classList.add("open");
  document.body.classList.add("modal-open");
});
document.getElementById("closeBackupBtn").addEventListener("click", () => {
  document.getElementById("backupModal").classList.remove("open");
  document.body.classList.remove("modal-open");
});
document.getElementById("backupModal").addEventListener("click", e => {
  if (e.target.id === "backupModal") {
    document.getElementById("backupModal").classList.remove("open");
    document.body.classList.remove("modal-open");
  }
});
document.getElementById("exportJsonBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(books, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `manga_shelf_backup_${dateStr}.json`;
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById("importJsonBtn").addEventListener("click", () => {
  document.getElementById("importJsonInput").click();
});
document.getElementById("importJsonInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) throw new Error("Invalid format");
      books = imported.map(b => normalizeBook(b));
      saveBooks(books);
      renderList();
      document.getElementById("backupModal").classList.remove("open");
      document.body.classList.remove("modal-open");
      alert(`${books.length}作品のデータを復元しました。`);
    } catch (err) {
      alert("ファイルの読み込みに失敗しました。正しいバックアップファイルか確認してください。");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});
document.getElementById("resetInitialBtn").addEventListener("click", () => {
  if (confirm("現在のデータを消去して、最初の68作品データに戻しますか？")) {
    books = cloneInitialBooks();
    saveBooks(books);
    renderList();
    document.getElementById("backupModal").classList.remove("open");
    document.body.classList.remove("modal-open");
  }
});

// Initial render
renderList();
</script>
