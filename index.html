<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="漫画本棚" />
<meta name="theme-color" content="#0F1115" />
<title>漫画本棚</title>
<style>
:root {
  --bg: #0f1115;
  --surface: #181b22;
  --surface-2: #222631;
  --border: #2c313f;
  --text: #f3f4f6;
  --text-sub: #9ca3af;
  --accent: #f97316;
  --accent-dim: rgba(249, 115, 22, 0.16);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.16);
  --red-text: #fca5a5;
  --blue: #3b82f6;
  --blue-bg: rgba(59, 130, 246, 0.16);
  --blue-text: #93c5fd;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.16);
  --green-text: #6ee7b7;
  --purple: #a855f7;
  --purple-bg: rgba(168, 85, 247, 0.16);
  --purple-text: #d8b4fe;
  --teal: #14b8a6;
  --teal-bg: rgba(20, 184, 166, 0.16);
  --teal-text: #5eead4;
  --gray-bg: rgba(156, 163, 175, 0.14);
  --gray-text: #d1d5db;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
  min-height: 100vh;
}
body.modal-open {
  overflow: hidden;
}

/* すべての数値入力・セレクトの上下矢印を非表示 */
input[type="number"] {
  -moz-appearance: textfield;
  appearance: textfield;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  appearance: none;
  margin: 0;
}
select {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  background-image: none;
}

/* Sticky Top Group */
.sticky-top-group {
  position: sticky;
  top: 0;
  z-index: 30;
  background: #0f1115;
}

/* Header */
.app-header {
  background: #0f1115;
  border-bottom: 1px solid var(--border);
  padding: calc(10px + var(--safe-top)) 14px 10px;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.app-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.app-title-badge {
  font-size: 11px;
  font-weight: 700;
  background: var(--accent-dim);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 999px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  height: 38px;
  padding: 0 11px;
  font-size: 13px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:active {
  transform: scale(0.97);
}
.icon-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.icon-btn.commit-btn {
  background: var(--green);
  border-color: var(--green);
  color: #06281e;
  font-weight: 800;
}

/* Mode Tabs */
.mode-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 8px;
}
.mode-tab {
  border: none;
  background: transparent;
  color: var(--text-sub);
  border-radius: 9px;
  padding: 8px 6px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  white-space: nowrap;
}
.mode-tab.active {
  background: var(--accent);
  color: #fff;
}
.tab-badge {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.25);
  color: inherit;
}

/* Search & Controls */
.search-wrap {
  position: relative;
  margin-bottom: 8px;
}
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 34px 10px 34px;
  font-size: 15px;
  outline: none;
}
.search-input:focus {
  border-color: var(--accent);
}
.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-sub);
  font-size: 14px;
  pointer-events: none;
}
.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--surface-2);
  border: none;
  color: var(--text-sub);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  font-size: 12px;
  cursor: pointer;
  display: none;
}
.search-clear.visible {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.control-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.select-box {
  flex: 1;
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 600;
  outline: none;
}
.chips-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 7px 0 1px;
  scrollbar-width: none;
}
.chips-scroll::-webkit-scrollbar {
  display: none;
}
.sub-kana-row {
  display: none;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 0 2px;
  scrollbar-width: none;
}
.sub-kana-row::-webkit-scrollbar {
  display: none;
}
.sub-kana-row.open {
  display: flex;
}
.chip {
  flex: 0 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-sub);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.kana-chip.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.char-chip.active {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}

/* Summary Strip */
.summary-bar {
  padding: 8px 14px;
  font-size: 12px;
  color: var(--text-sub);
  border-bottom: 1px solid var(--border);
  background: #13161c;
}
.summary-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 12px;
}
.summary-row + .summary-row {
  margin-top: 5px;
  padding-top: 5px;
  border-top: 1px dashed rgba(255, 255, 255, 0.08);
}
.summary-bar strong {
  color: var(--text);
}
.summary-price strong {
  color: #fdba74;
}
.calc-summary-bar {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid rgba(249, 115, 22, 0.4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 12px;
  color: #fdba74;
}
.calc-summary-bar strong {
  color: #fff;
}
.calc-summary-bar .calc-total-price strong {
  color: #fdba74;
  font-size: 14px;
}

/* Book List */
.book-list {
  padding: 10px 12px calc(36px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 9px;
  max-width: 760px;
  margin: 0 auto;
}
.book-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 11px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.book-card:active {
  background: var(--surface-2);
  border-color: #3f4659;
}

/* Book Cover Thumbnail */
.book-cover-thumb {
  width: 68px;
  height: 97px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--surface-2);
  border: 1px solid var(--border);
  flex-shrink: 0;
  display: block;
}
.book-cover-placeholder {
  width: 68px;
  height: 97px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px dashed var(--border);
  color: var(--text-sub);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  line-height: 1.35;
  padding: 4px;
}

.shopping-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
}
.shopping-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.shopping-vol-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
}
.shop-vol-btn {
  min-width: 40px;
  height: 36px;
  padding: 0 9px;
  border-radius: 9px;
  border: 1px solid rgba(239, 68, 68, 0.45);
  background: var(--red-bg);
  color: var(--red-text);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
.shop-vol-btn.selected {
  background: var(--blue-bg);
  border-color: rgba(59, 130, 246, 0.75);
  color: var(--blue-text);
}
.shop-vol-btn.vol0-type {
  border-color: rgba(168, 85, 247, 0.45);
  background: var(--purple-bg);
  color: var(--purple-text);
}
.shop-vol-btn.vol0-type.selected {
  background: var(--blue-bg);
  border-color: rgba(59, 130, 246, 0.75);
  color: var(--blue-text);
}
.shop-vol-btn.spin-type {
  border-color: rgba(20, 184, 166, 0.45);
  background: var(--teal-bg);
  color: var(--teal-text);
}
.shop-vol-btn.spin-type.selected {
  background: var(--blue-bg);
  border-color: rgba(59, 130, 246, 0.75);
  color: var(--blue-text);
}
.shop-select-all-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-sub);
  border-radius: 8px;
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
}
.shop-select-all-btn.all-checked {
  background: var(--blue-bg);
  border-color: rgba(59, 130, 246, 0.5);
  color: var(--blue-text);
}

/* Calc Page Cards */
.calc-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.calc-card.checked {
  background: rgba(249, 115, 22, 0.08);
  border-color: rgba(249, 115, 22, 0.55);
}
.calc-checkbox {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid var(--text-sub);
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 900;
  color: #fff;
}
.calc-card.checked .calc-checkbox {
  background: var(--accent);
  border-color: var(--accent);
}
.calc-title {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  word-break: break-word;
}
.calc-price-text {
  font-size: 14px;
  font-weight: 800;
  color: #fdba74;
  flex-shrink: 0;
}
.calc-price-text.unpriced {
  color: var(--text-sub);
  font-weight: 600;
  font-size: 12px;
}

.book-main {
  min-width: 0;
  flex: 1;
}
.book-meta-top {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 5px;
}
.tag {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  line-height: 1.3;
}
.tag-status-end {
  background: var(--gray-bg);
  color: var(--gray-text);
}
.tag-status-on {
  background: var(--accent-dim);
  color: #fdba74;
}
.tag-owned-unstarted {
  background: rgba(107, 114, 128, 0.22);
  color: #9ca3af;
}
.tag-owned-uptodate {
  background: var(--blue-bg);
  color: var(--blue-text);
}
.tag-owned-complete {
  background: var(--green-bg);
  color: var(--green-text);
}
.tag-vol0 {
  background: var(--purple-bg);
  color: var(--purple-text);
}
.tag-spin {
  background: var(--teal-bg);
  color: var(--teal-text);
}
.book-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.35;
  word-break: break-word;
}
.book-pub-line {
  font-size: 12px;
  color: var(--text-sub);
  margin-bottom: 4px;
  word-break: break-word;
}
.book-counts {
  font-size: 13px;
  color: var(--text-sub);
  font-weight: 600;
}
.book-rem-inline {
  margin-left: 6px;
  color: var(--red-text);
  font-weight: 800;
}
.book-missing-line {
  margin-top: 5px;
  font-size: 12px;
  font-weight: 700;
  color: var(--red-text);
  background: rgba(239, 68, 68, 0.09);
  border: 1px solid rgba(239, 68, 68, 0.24);
  border-radius: 8px;
  padding: 4px 8px;
  display: inline-block;
  max-width: 100%;
  word-break: break-word;
}
.book-memo-line {
  margin-top: 5px;
  font-size: 12px;
  color: var(--text-sub);
  background: var(--surface-2);
  border-radius: 8px;
  padding: 5px 8px;
  word-break: break-word;
}
.book-chevron {
  color: var(--text-sub);
  font-size: 18px;
  flex-shrink: 0;
}

/* Detail / Edit Modal Sheet */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0, 0, 0, 0.78);
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-backdrop.open {
  display: flex;
}
.modal-sheet {
  background: var(--bg);
  width: 100%;
  max-width: 760px;
  height: 100dvh;
  max-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  flex-shrink: 0;
  padding: calc(10px + var(--safe-top)) 14px 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  z-index: 10;
}
.modal-header-title {
  font-size: 15px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
  flex: 1;
}
.modal-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px calc(36px + var(--safe-bottom));
}

/* Top Row inside Detail */
.detail-top-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.cover-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  position: relative;
}
.cover-tap-box {
  width: 98px;
  height: 140px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px dashed var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  color: var(--text-sub);
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  padding: 4px;
  line-height: 1.35;
}
.cover-tap-box:active {
  border-color: var(--accent);
}
.cover-tap-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 9px;
}
.detail-title-pub-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.title-yomi-inline {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.inline-yomi-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}
.yomi-trigger-btn {
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-sub);
  cursor: pointer;
}
.yomi-trigger-btn:active,
.yomi-trigger-btn.has-value {
  color: var(--text);
}
.inline-yomi-input {
  width: 132px;
  background: var(--surface-2);
  border: 1px solid var(--accent);
  color: var(--text);
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 12px;
  font-weight: 600;
  outline: none;
}
.cover-remove-badge {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 24px;
  height: 24px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.94);
  color: #111827;
  border: 1px solid rgba(0, 0, 0, 0.14);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 900;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  z-index: 2;
}
.cover-col.show-remove .cover-remove-badge {
  display: inline-flex;
}
.cover-remove-badge:active {
  transform: scale(0.92);
}

/* Form in Detail */
.field-group {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
}
.field-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 12px;
}
.field-row:last-child {
  margin-bottom: 0;
}
.field-row-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.field-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-sub);
  line-height: 1.3;
}
.price-calc-inline {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  height: 42px;
  line-height: 1;
  font-size: 12px;
  color: var(--text-sub);
  font-weight: 700;
  flex-shrink: 0;
}
.custom-vol-input {
  width: 48px;
  height: 30px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 7px;
  padding: 0 5px;
  font-size: 13px;
  font-weight: 800;
  line-height: 1;
  text-align: center;
  outline: none;
}
.custom-vol-input:focus {
  border-color: var(--accent);
}
.price-single-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.price-single-row .text-input {
  flex: 1;
  min-width: 0;
  height: 42px;
}
.text-input, .textarea-input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 11px;
  font-size: 15px;
  outline: none;
  font-family: inherit;
}
.textarea-input {
  min-height: 68px;
  resize: vertical;
  line-height: 1.45;
}
.text-input:focus, .textarea-input:focus {
  border-color: var(--accent);
}
.stepper-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stepper-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  flex-shrink: 0;
}
.stepper-btn:active {
  background: var(--accent);
  border-color: var(--accent);
}

/* Batch / Range Tool Box */
.batch-box {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  margin-top: 10px;
}
.batch-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 8px;
}
.range-inputs {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.range-num {
  width: 72px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 8px;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
}
.range-sep {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sub);
}

/* Quick Actions & Volume Grid */
.detail-status-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
}
.quick-btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.quick-btn {
  flex: 1;
  min-width: 110px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.quick-btn.all-on {
  background: var(--blue-bg);
  border-color: rgba(59, 130, 246, 0.45);
  color: var(--blue-text);
}
.quick-btn.all-off {
  background: var(--red-bg);
  border-color: rgba(239, 68, 68, 0.35);
  color: var(--red-text);
}
.vol-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 14px 0 8px;
  font-size: 13px;
  font-weight: 800;
  color: var(--text-sub);
}
.vol-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
}
@media (min-width: 520px) {
  .vol-grid {
    grid-template-columns: repeat(8, 1fr);
  }
}
.vol-tile {
  height: 46px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  transition: transform 0.08s ease;
}
.vol-tile:active {
  transform: scale(0.94);
}
.vol-tile.missing {
  background: var(--red-bg);
  border-color: rgba(239, 68, 68, 0.45);
  color: var(--red-text);
}
.vol-tile.owned {
  background: var(--blue-bg);
  border-color: rgba(59, 130, 246, 0.55);
  color: var(--blue-text);
}
.vol-tile.vol0-tile.missing {
  background: var(--purple-bg);
  border-color: rgba(168, 85, 247, 0.45);
  color: var(--purple-text);
}
.vol-tile.vol0-tile.owned {
  background: rgba(168, 85, 247, 0.34);
  border-color: rgba(192, 132, 252, 0.75);
  color: #f3e8ff;
}
.vol-tile.spin-tile.missing {
  background: var(--teal-bg);
  border-color: rgba(20, 184, 166, 0.45);
  color: var(--teal-text);
}
.vol-tile.spin-tile.owned {
  background: rgba(20, 184, 166, 0.32);
  border-color: rgba(94, 234, 212, 0.75);
  color: #ccfbf1;
}

.extra-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  margin-top: 12px;
}
.extra-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.extra-card-title {
  font-size: 14px;
  font-weight: 800;
}
.extra-card-sub {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 2px;
}
.sub-action-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.sub-action-btn.purple {

  border-color: rgba(168, 85, 247, 0.4);

}
.sub-action-btn.danger-sm {
  color: var(--red-text);
  border-color: rgba(239, 68, 68, 0.35);
  background: var(--red-bg);

/* Backup Modal */
.backup-box {

  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.backup-box h3 {
  margin: 0 0 6px;
  font-size: 15px;
}
.backup-box p {
  margin: 0 0 12px;
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.5;
}
.danger-btn {
  background: var(--red-bg);
  border: 1px solid rgba(239, 68, 68, 0.45);

  border-radius: 10px;
  padding: 11px 14px;
  font-size: 13px;
  font-weight: 800;
  width: 100%;

  margin-top: 18px;
}
.empty-state {

  padding: 48px 16px;
  color: var(--text-sub);
  font-size: 14px;

<div class="sticky-top-group" id="stickyTopGroup">
  <header class="app-header">
    <div class="header-top">
      <div class="app-title">
        <span>📚 漫画本棚</span>
        <span class="app-title-badge" id="totalCountBadge">0作品</span>
      </div>
      <div class="header-actions" id="mainHeaderActions">
        <button type="button" class="icon-btn" id="openBackupBtn" title="保存・復元">⚙ 保存/復元</button>
        <button type="button" class="icon-btn primary" id="addBookBtn">＋ 追加</button>
      </div>
      <div class="header-actions" id="shopHeaderActions" style="display:none;">
        <button type="button" class="icon-btn" id="clearShopSelectionBtn">選択解除</button>

      <div class="header-actions" id="calcHeaderActions" style="display:none;">
        <button type="button" class="icon-btn" id="clearCalcSelectionBtn">選択解除</button>
      </div>
    </div>

    <div class="mode-tabs" role="tablist">
      <button type="button" class="mode-tab active" data-tab="shelf" id="tabShelfBtn">📚 本棚</button>

      <button type="button" class="mode-tab" data-tab="calc" id="tabCalcBtn">🧮 金額計算</button>

        <option value="">出版社・雑誌：すべて</option>
      </select>
    </div>
    <div class="chips-scroll" id="filterChips">

      <button type="button" class="chip" data-filter="complete_all">完結</button>

      <button type="button" class="chip kana-chip" data-kana="s">さ</button>
      <button type="button" class="chip kana-chip" data-kana="t">た</button>
      <button type="button" class="chip kana-chip" data-kana="n">な</button>

      <button type="button" class="chip kana-chip" data-kana="m">ま</button>

      <button type="button" class="chip kana-chip" data-kana="w">わ</button>
    </div>
    <div class="sub-kana-row" id="subKanaRow" aria-label="行内の文字絞り込み"></div>
  </header>

  <div class="summary-bar" id="summaryBar">

  </div>
</div>

const DB_NAME = "manga_shelf_covers_db";
const DB_STORE = "covers";

const KANA_GROUPS = {
  a: { label: "あ行", chars: ["あ", "い", "う", "え", "お"] },
  k: { label: "か行", chars: ["か", "き", "く", "け", "こ"] },
  s: { label: "さ行", chars: ["さ", "し", "す", "せ", "そ"] },
  t: { label: "た行", chars: ["た", "ち", "つ", "て", "と"] },

// In-memory cover cache: Map<bookId, dataUrlString>
const coverMap = new Map();

function openCoverDb() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error("IndexedDB not supported"));
      return;
    }
    const req = window.indexedDB.open(DB_NAME, 2);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB_STORE)) {
        db.createObjectStore(DB_STORE);
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function loadAllCoversFromDb() {
  try {
    const db = await openCoverDb();
    return await new Promise(resolve => {
      const tx = db.transaction(DB_STORE, "readonly");
      const store = tx.objectStore(DB_STORE);
      const req = store.openCursor();
      req.onsuccess = e => {
        const cursor = e.target.result;
        if (cursor) {
          coverMap.set(Number(cursor.key), cursor.value);
          cursor.continue();
        } else {
          resolve();
        }
      };
      req.onerror = () => resolve();
    });
  } catch (e) {
    console.warn("Cover DB load fallback:", e);
  }
}

async function saveCoverToDb(bookId, dataUrl) {
  const id = Number(bookId);
  if (dataUrl) {
    coverMap.set(id, dataUrl);
  } else {
    coverMap.delete(id);
  }
  try {
    const db = await openCoverDb();
    await new Promise(resolve => {
      const tx = db.transaction(DB_STORE, "readwrite");
      const store = tx.objectStore(DB_STORE);
      if (dataUrl) {
        store.put(dataUrl, id);
      } else {
        store.delete(id);
      }
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  } catch (e) {
    console.warn("Cover DB save warning:", e);
  }
}

async function clearAllCoversFromDb() {
  coverMap.clear();
  try {
    const db = await openCoverDb();
    await new Promise(resolve => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  } catch (e) {
    console.warn("Cover DB clear warning:", e);
  }
}

function compressImageFile(file, maxWidth = 280, maxHeight = 400, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        const ratio = Math.min(maxWidth / w, maxHeight / h, 1);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        try {
          const out = canvas.toDataURL("image/jpeg", quality);
          resolve(out);
        } catch (err) {
          reject(err);
        }
      };
      img.onerror = () => reject(new Error("Image decode error"));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error("File read error"));
    reader.readAsDataURL(file);
  });
}

function normalizeBook(raw) {
  const latest = Math.min(MAX_VOL, Math.max(0, Number(raw.latest) || 0));
  const owned = Array.isArray(raw.owned)
    ? Array.from(new Set(raw.owned.map(Number).filter(v => Number.isInteger(v) && v >= 1 && v <= MAX_VOL))).sort((a, b) => a - b)
    : [];
  const hasVol0 = Boolean(raw.hasVol0);
  const vol0Owned = hasVol0 ? Boolean(raw.vol0Owned) : false;

  const spinoffTotal = Math.min(100, Math.max(0, Number(raw.spinoffTotal) || 0));
  const spinoffOwned = Array.isArray(raw.spinoffOwned)
    ? Array.from(new Set(raw.spinoffOwned.map(Number).filter(v => Number.isInteger(v) && v >= 1 && v <= spinoffTotal))).sort((a, b) => a - b)
    : [];

  const priceNum = Math.max(0, Math.floor(Number(raw.price) || 0));
  const customUnitVolsNum = Math.min(MAX_VOL, Math.max(0, Math.floor(Number(raw.customUnitVols) || 0)));

  return {
    id: Number(raw.id) || 1,
    title: String(raw.title || ""),
    yomi: String(raw.yomi || ""),
    publisher: String(raw.publisher || ""),
    magazine: String(raw.magazine || ""),
    status: raw.status === "完結" ? "完結" : "連載中",
    latest,
    owned,
    hasVol0,
    vol0Owned,
    spinoffTotal,
    spinoffOwned,
    memo: String(raw.memo || ""),
    price: priceNum,
    customUnitVols: customUnitVolsNum
  };
}

function cloneInitialBooks() {

function loadBooks() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);

      if (Array.isArray(parsed) && parsed.length > 0) {
        return parsed.map(b => normalizeBook(b));
      }
    }
  } catch (e) {
    console.warn("localStorage read fallback:", e);
  }
  return cloneInitialBooks();
}

function saveBooks(list) {

function toHiraganaFirstChar(str) {
  const s = (str || "").trim();
  if (!s) return "";
  const ch = s[0];
  const code = ch.charCodeAt(0);
  if (code >= 0x30A1 && code <= 0x30F6) {
    return String.fromCharCode(code - 0x60);
  }
  return ch;
}

const VOICED_TO_BASE = {
  "が": "か", "ぎ": "き", "ぐ": "く", "げ": "け", "ご": "こ",
  "ざ": "さ", "じ": "し", "ず": "す", "ぜ": "せ", "ぞ": "そ",
  "だ": "た", "ぢ": "ち", "づ": "つ", "で": "て", "ど": "と",
  "ば": "は", "び": "ひ", "ぶ": "ふ", "べ": "へ", "ぼ": "ほ",
  "ぱ": "は", "ぴ": "ひ", "ぷ": "ふ", "ぺ": "へ", "ぽ": "ほ",
  "ぁ": "あ", "ぃ": "い", "ぅ": "う", "ぇ": "え", "ぉ": "お",
  "っ": "つ",
  "ゃ": "や", "ゅ": "ゆ", "ょ": "よ"
};

function matchesKanaOrChar(book, group, specificChar) {
  if (!group && !specificChar) return true;
  const source = (book.yomi || book.title || "").trim();
  let first = toHiraganaFirstChar(source);
  if (VOICED_TO_BASE[first]) {
    first = VOICED_TO_BASE[first];
  }
  if (specificChar) {
    return first === specificChar;
  }
  const grp = KANA_GROUPS[group];
  if (!grp) return true;
  return grp.chars.includes(first);
}

}

function refreshPubFilterOptions() {
  const sel = document.getElementById("pubFilterSelect");
  const prev = currentPubFilter;
  const pubCounts = new Map();
  const magCounts = new Map();
  books.forEach(b => {
    const p = (b.publisher || "").trim();
    const m = (b.magazine || "").trim();
    if (p) pubCounts.set(p, (pubCounts.get(p) || 0) + 1);
    if (m) magCounts.set(m, (magCounts.get(m) || 0) + 1);
  });

  const sortByCountDesc = ([aName, aCount], [bName, bCount]) => {
    if (bCount !== aCount) return bCount - aCount;
    return aName.localeCompare(bName, "ja");
  };

  const pubs = Array.from(pubCounts.entries()).sort(sortByCountDesc);
  const mags = Array.from(magCounts.entries()).sort(sortByCountDesc);

  let html = `<option value="">出版社・雑誌：すべて</option>`;
  if (pubs.length > 0) {
    html += `<optgroup label="出版社">` + pubs.map(([p, cnt]) => `<option value="pub:${escapeHtml(p)}">${escapeHtml(p)} (${cnt})</option>`).join("") + `</optgroup>`;
  }
  if (mags.length > 0) {
    html += `<optgroup label="雑誌・レーベル">` + mags.map(([m, cnt]) => `<option value="mag:${escapeHtml(m)}">${escapeHtml(m)} (${cnt})</option>`).join("") + `</optgroup>`;
  }
  sel.innerHTML = html;

  const hasPrev = Array.from(sel.options).some(opt => opt.value === prev);
  if (hasPrev) {
    sel.value = prev;
  } else {
    currentPubFilter = "";
    sel.value = "";
  }
}

function formatMissingRanges(book) {
  const ownedSet = new Set(book.owned || []);
  const missing = [];
  for (let v = 1; v <= book.latest; v++) {
    if (!ownedSet.has(v)) missing.push(v);
  }
  if (missing.length === 0) return "";
  const ranges = [];
  let start = missing[0];
  let prev = missing[0];
  for (let i = 1; i < missing.length; i++) {
    const cur = missing[i];
    if (cur === prev + 1) {
      prev = cur;
    } else {
      ranges.push(start === prev ? `${start}` : `${start}～${prev}`);
      start = cur;
      prev = cur;
    }
  }
  ranges.push(start === prev ? `${start}` : `${start}～${prev}`);
  return ranges.join(", ") + "巻";
}

function getMissingTokensForBook(book) {
  const tokens = [];
  if (book.hasVol0 && !book.vol0Owned) {
    tokens.push({ key: "vol0", label: "0巻", type: "vol0" });
  }
  const ownedSet = new Set(book.owned || []);
  for (let v = 1; v <= (Number(book.latest) || 0); v++) {
    if (!ownedSet.has(v)) {
      tokens.push({ key: `main:${v}`, label: `${v}`, type: "main" });
    }
  }
  const spinTotal = Number(book.spinoffTotal) || 0;
  const spinOwnedSet = new Set(book.spinoffOwned || []);
  for (let s = 1; s <= spinTotal; s++) {
    if (!spinOwnedSet.has(s)) {
      tokens.push({ key: `spin:${s}`, label: `外${s}`, type: "spin" });
    }
  }
  return tokens;
}

function hasAnyMissingItem(book) {
  return getMissingTokensForBook(book).length > 0;
}

function getMainOwnedCount(book) {
  if (!book.owned) return 0;
  return book.owned.filter(v => v >= 1 && v <= MAX_VOL).length;
}

function getMissingMainCount(book) {
  return Math.max(0, (Number(book.latest) || 0) - getMainOwnedCount(book));
}

function getVol0OwnedCount(book) {
  return (book.hasVol0 && book.vol0Owned) ? 1 : 0;
}

function getSpinoffOwnedCount(book) {
  const total = Number(book.spinoffTotal) || 0;
  if (total <= 0 || !Array.isArray(book.spinoffOwned)) return 0;
  return book.spinoffOwned.filter(v => v >= 1 && v <= total).length;
}

function getTotalOwnedCount(book) {
  return getMainOwnedCount(book) + getVol0OwnedCount(book) + getSpinoffOwnedCount(book);
}

function getTotalPossibleCount(book) {
  return (Number(book.latest) || 0) + (book.hasVol0 ? 1 : 0) + (Number(book.spinoffTotal) || 0);
}

function getTotalMissingCount(book) {
  return getMissingTokensForBook(book).length;
}

function getUnitPrice(book, customVols = 0) {
  const price = Number(book.price) || 0;
  const vols = customVols > 0 ? Number(customVols) : getTotalMissingCount(book);
  if (price <= 0 || vols <= 0) return 0;
  return Math.round(price / vols);
}

function hasAnyOwnedTitle(book) {
  return getTotalOwnedCount(book) > 0;
}

function getDerivedStatus(book) {
  const ownedCount = getMainOwnedCount(book);
  const missingCount = getMissingMainCount(book);
  if (missingCount > 0) {
    return ownedCount > 0 ? "未所持あり" : "未購入";
  }
  return book.status === "連載中" ? "既刊まで所持" : "コンプ";
}

function compareKana(a, b) {
  const ka = (a.yomi || a.title || "").trim();
  const kb = (b.yomi || b.title || "").trim();
  return ka.localeCompare(kb, "ja");
}

function getFilteredAndSortedBooks() {
  const q = searchQuery.trim().toLowerCase();
  let list = books.filter(book => {
    if (currentTab === "shopping" && !hasAnyMissingItem(book)) {
      return false;
    }
    if (q) {
      const t = (book.title || "").toLowerCase();
      const y = (book.yomi || "").toLowerCase();
      const p = (book.publisher || "").toLowerCase();
      const m = (book.magazine || "").toLowerCase();
      const mem = (book.memo || "").toLowerCase();
      if (!t.includes(q) && !y.includes(q) && !p.includes(q) && !m.includes(q) && !mem.includes(q)) return false;
    }
    if (currentPubFilter) {
      if (currentPubFilter.startsWith("pub:")) {
        const targetPub = currentPubFilter.slice(4);
        if ((book.publisher || "").trim() !== targetPub) return false;
      } else if (currentPubFilter.startsWith("mag:")) {
        const targetMag = currentPubFilter.slice(4);
        if ((book.magazine || "").trim() !== targetMag) return false;
      }
    }
    if (!matchesKanaOrChar(book, currentKana, currentChar)) {
      return false;
    }
    const ownedCount = getMainOwnedCount(book);
    const missingCount = getMissingMainCount(book);
    const derived = getDerivedStatus(book);
    const hasPrice = (Number(book.price) || 0) > 0;

    switch (currentFilter) {
      case "complete_all":
        return book.status === "完結";
      case "complete_missing":
        return book.status === "完結" && missingCount > 0;
      case "owned_missing":
        return ownedCount >= 1 && missingCount > 0;
      case "unstarted":
        return ownedCount === 0 && book.latest > 0;
      case "ongoing":
        return book.status === "連載中";
      case "comp":
        return derived === "コンプ";
      case "priced_non_comp":
        return derived !== "コンプ" && hasPrice;
      case "unpriced_non_comp":
        return derived !== "コンプ" && !hasPrice;
      default:
        return true;
    }
  });

  list.sort((a, b) => {
    const oa = getMainOwnedCount(a);
    const ob = getMainOwnedCount(b);
    const ma = getMissingMainCount(a);
    const mb = getMissingMainCount(b);
    if (currentSort === "kana") {
      return compareKana(a, b);
    }
    if (currentSort === "complete_owned_first") {
      const rank = (bk, oc, mc) => {
        if (bk.status === "完結") {
          if (oc >= 1 && mc > 0) return 0;
          if (oc >= 1 && mc === 0) return 1;
          return 2;
        }
        return 3;
      };
      const ra = rank(a, oa, ma);
      const rb = rank(b, ob, mb);
      if (ra !== rb) return ra - rb;
      return compareKana(a, b);
    }
    if (currentSort === "complete_all") {
      const ra = a.status === "完結" ? 0 : 1;
      const rb = b.status === "完結" ? 0 : 1;
      if (ra !== rb) return ra - rb;
      return compareKana(a, b);
    }
    if (currentSort === "missing_partial_first") {
      const ra = (oa >= 1 && ma > 0) ? 0 : (oa === 0 && ma > 0 ? 1 : 2);
      const rb = (ob >= 1 && mb > 0) ? 0 : (ob === 0 && mb > 0 ? 1 : 2);
      if (ra !== rb) return ra - rb;
      return compareKana(a, b);
    }
    if (currentSort === "missing_count_desc") {
      if (mb !== ma) return mb - ma;
      return compareKana(a, b);
    }
    if (currentSort === "owned_count_desc") {
      const ta = getTotalOwnedCount(a);
      const tb = getTotalOwnedCount(b);
      if (tb !== ta) return tb - ta;
      return compareKana(a, b);
    }
    return compareKana(a, b);
  });
  return list;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatPubMag(book) {
  const parts = [];
  if (book.publisher) parts.push(book.publisher);
  if (book.magazine) parts.push(book.magazine);
  return parts.join(" / ");
}

function renderList() {

  if (currentTab === "calc") {
    container.innerHTML = list.map(book => {
      const checked = calcSelectedIds.has(book.id);
      const p = Number(book.price) || 0;
      const priceHtml = p > 0
        ? `<span class="calc-price-text">¥${p.toLocaleString()}</span>`
        : `<span class="calc-price-text unpriced">未入力</span>`;
      return `
        <div class="calc-card ${checked ? "checked" : ""}" data-calc-id="${book.id}">
          <span class="calc-checkbox">${checked ? "✓" : ""}</span>
          <span class="calc-title">${escapeHtml(book.title)}</span>
          ${priceHtml}
        </div>
      `;
    }).join("");

    container.querySelectorAll(".calc-card").forEach(card => {
      card.addEventListener("click", () => {
        const bId = Number(card.getAttribute("data-calc-id"));
        if (calcSelectedIds.has(bId)) calcSelectedIds.delete(bId);
        else calcSelectedIds.add(bId);
        renderList();
      });
    });
    return;
  }

  if (currentTab === "shopping") {
    container.innerHTML = list.map(book => {
      const mainOwned = getMainOwnedCount(book);
      const missingTokens = getMissingTokensForBook(book);
      const selectedSet = getShopBookSet(book.id);
      const pubMagText = formatPubMag(book);
      const statusTagClass = book.status === "完結" ? "tag-status-end" : "tag-status-on";
      const derived = getDerivedStatus(book);

      const showDerivedBadge = derived === "未購入";
      const derivedBadge = showDerivedBadge
        ? `<span class="tag tag-owned-unstarted">未購入</span>`
        : "";
      const pubLine = pubMagText
        ? `<div class="book-pub-line">${escapeHtml(pubMagText)}</div>`
        : "";
      const memoLine = book.memo && book.memo.trim()
        ? `<div class="book-memo-line">📝 ${escapeHtml(book.memo.trim())}</div>`
        : "";

      const allSelected = missingTokens.length > 0 && missingTokens.every(t => selectedSet.has(t.key));
      const chipsHtml = missingTokens.map(tok => {
        const isSel = selectedSet.has(tok.key);
        const typeCls = tok.type === "vol0" ? "vol0-type" : (tok.type === "spin" ? "spin-type" : "");
        return `<button type="button" class="shop-vol-btn ${typeCls} ${isSel ? "selected" : ""}" data-book-id="${book.id}" data-token="${tok.key}">${escapeHtml(tok.label)}</button>`;
      }).join("");

      return `
        <article class="shopping-card" data-book-id="${book.id}">
          <div class="shopping-card-head">
            ${renderCoverThumbHtml(book.id)}
            <div class="book-main">
              <div class="book-meta-top">
                <span class="tag ${statusTagClass}">${escapeHtml(book.status)}</span>
                ${derivedBadge}
              </div>
              <div class="book-title">${escapeHtml(book.title)}</div>
              ${pubLine}
              <div class="book-counts">既刊${book.latest}巻 / 所持${mainOwned}巻<span class="book-rem-inline">あと${missingTokens.length}冊</span></div>
            </div>
            <button type="button" class="shop-select-all-btn ${allSelected ? "all-checked" : ""}" data-select-all-book="${book.id}">${allSelected ? "全解除" : "全選択"}</button>
          </div>
          <div class="shopping-vol-chips">${chipsHtml}</div>
          ${memoLine}
        </article>
      `;
    }).join("");

    container.querySelectorAll(".shop-vol-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const bId = Number(btn.getAttribute("data-book-id"));
        const token = btn.getAttribute("data-token");
        const set = getShopBookSet(bId);
        if (set.has(token)) set.delete(token);
        else set.add(token);
        renderList();
      });
    });

    container.querySelectorAll(".shop-select-all-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const bId = Number(btn.getAttribute("data-select-all-book"));
        const book = books.find(b => b.id === bId);
        if (!book) return;
        const tokens = getMissingTokensForBook(book);
        const set = getShopBookSet(bId);
        const allSelected = tokens.length > 0 && tokens.every(t => set.has(t.key));
        if (allSelected) {
          set.clear();
        } else {
          tokens.forEach(t => set.add(t.key));
        }
        renderList();
      });
    });
    return;
  }

  container.innerHTML = list.map(book => {
    const mainOwned = getMainOwnedCount(book);
    const missingCount = getMissingMainCount(book);
    const spinTotal = Number(book.spinoffTotal) || 0;
    const spinOwned = getSpinoffOwnedCount(book);
    const derived = getDerivedStatus(book);
    const missingText = formatMissingRanges(book);
    const pubMagText = formatPubMag(book);
    const statusTagClass = book.status === "完結" ? "tag-status-end" : "tag-status-on";

    const showDerivedBadge = derived === "未購入" || derived === "コンプ" || derived === "既刊まで所持";
    let derivedClass = "tag-owned-complete";
    if (derived === "未購入") derivedClass = "tag-owned-unstarted";
    else if (derived === "既刊まで所持") derivedClass = "tag-owned-uptodate";
    const derivedBadge = showDerivedBadge
      ? `<span class="tag ${derivedClass}">${escapeHtml(derived)}</span>`
      : "";

    const vol0Badge = book.hasVol0
      ? `<span class="tag tag-vol0">${book.vol0Owned ? "0巻所持" : "0巻あり"}</span>`
      : "";
    const spinBadge = spinTotal > 0
      ? `<span class="tag tag-spin">番外編 ${spinOwned}/${spinTotal}</span>`
      : "";
    const pubLine = pubMagText
      ? `<div class="book-pub-line">${escapeHtml(pubMagText)}</div>`
      : "";
    const remInline = missingCount > 0
      ? `<span class="book-rem-inline">あと${missingCount}冊</span>`
      : "";
    const missingLine = missingText
      ? `<div class="book-missing-line">未所持：${escapeHtml(missingText)}</div>`
      : "";
    const memoLine = book.memo && book.memo.trim()
      ? `<div class="book-memo-line">📝 ${escapeHtml(book.memo.trim())}</div>`
      : "";

    const extraCountNote = (book.vol0Owned || spinOwned > 0)
      ? `（計${getTotalOwnedCount(book)}冊）`
      : "";

    return `
      <article class="book-card" data-id="${book.id}">
        ${renderCoverThumbHtml(book.id)}
        <div class="book-main">
          <div class="book-meta-top">
            <span class="tag ${statusTagClass}">${escapeHtml(book.status)}</span>
            ${derivedBadge}
            ${vol0Badge}
            ${spinBadge}
          </div>
          <div class="book-title">${escapeHtml(book.title)}</div>
          ${pubLine}
          <div class="book-counts">既刊${book.latest}巻 / 所持${mainOwned}巻${extraCountNote}${remInline}</div>
          ${missingLine}
          ${memoLine}
        </div>
        <div class="book-chevron">›</div>
      </article>
    `;
  }).join("");

  container.querySelectorAll(".book-card").forEach(card => {
    card.addEventListener("click", () => {
      const id = Number(card.getAttribute("data-id"));
      openDetailModal(id);
    });
  });
}

// Tab Actions
document.getElementById("tabShelfBtn").addEventListener("click", () => {
  currentTab = "shelf";
  renderList();
});

document.getElementById("tabShoppingBtn").addEventListener("click", () => {
  currentTab = "shopping";
  renderList();
});

document.getElementById("tabCalcBtn").addEventListener("click", () => {
  currentTab = "calc";
  renderList();
});

document.getElementById("clearCalcSelectionBtn").addEventListener("click", () => {
  calcSelectedIds.clear();
  renderList();
});

document.getElementById("clearShopSelectionBtn").addEventListener("click", () => {
  shoppingSelections.clear();
  renderList();
});

document.getElementById("commitShopSelectionBtn").addEventListener("click", () => {
  const totalSelected = getTotalSelectedShopCount();
  if (totalSelected === 0) {
    alert("購入した巻を選択してください。");
    return;
  }

  shoppingSelections.forEach((tokenSet, bookId) => {
    if (tokenSet.size === 0) return;
    const idx = books.findIndex(b => b.id === bookId);
    if (idx === -1) return;
    const book = normalizeBook(books[idx]);
    const mainSet = new Set(book.owned || []);
    const spinSet = new Set(book.spinoffOwned || []);

    tokenSet.forEach(tok => {
      if (tok === "vol0") {
        book.hasVol0 = true;
        book.vol0Owned = true;
      } else if (tok.startsWith("main:")) {
        const v = Number(tok.slice(5));
        if (Number.isInteger(v) && v >= 1 && v <= MAX_VOL) {
          mainSet.add(v);
        }
      } else if (tok.startsWith("spin:")) {
        const s = Number(tok.slice(5));
        if (Number.isInteger(s) && s >= 1 && s <= book.spinoffTotal) {
          spinSet.add(s);
        }
      }
    });

    book.owned = Array.from(mainSet).sort((a, b) => a - b);
    book.spinoffOwned = Array.from(spinSet).sort((a, b) => a - b);
    books[idx] = normalizeBook(book);
  });

  shoppingSelections.clear();
  saveBooks(books);
  renderList();
});

function openDetailModal(bookId) {
  editingBookId = bookId;
  yomiInputOpen = false;
  showCoverRemoveBadge = false;
  if (bookId === null) {
    const maxId = books.reduce((m, b) => Math.max(m, b.id), 0);
    draftBook = normalizeBook({
      id: maxId + 1,
      title: "",
      yomi: "",
      publisher: "",
      magazine: "",
      status: "連載中",
      latest: 1,
      owned: [],
      hasVol0: false,
      vol0Owned: false,
      spinoffTotal: 0,
      spinoffOwned: [],
      memo: "",
      price: 0,
      customUnitVols: 0
    });
    draftCoverDataUrl = null;
    document.getElementById("detailHeaderTitle").textContent = "新しい作品を追加";
  } else {
    const orig = books.find(b => b.id === bookId);
    if (!orig) return;
    draftBook = normalizeBook(orig);
    draftCoverDataUrl = coverMap.get(Number(bookId)) || null;
    document.getElementById("detailHeaderTitle").textContent = draftBook.title || "作品詳細";
  }
  renderDetailBody();
  document.getElementById("detailBody").scrollTop = 0;
  document.getElementById("detailModal").classList.add("open");
  document.body.classList.add("modal-open");
}

function applyRangeOwned(fromVol, toVol, shouldOwn) {
  const maxV = Math.min(MAX_VOL, Math.max(0, Number(draftBook.latest) || 0));
  let a = parseInt(fromVol, 10);
  let b = parseInt(toVol, 10);
  if (isNaN(a)) a = 1;
  if (isNaN(b)) b = maxV;
  a = Math.max(1, Math.min(maxV, a));
  b = Math.max(1, Math.min(maxV, b));
  if (a > b) {
    const tmp = a;
    a = b;
    b = tmp;
  }
  const set = new Set(draftBook.owned || []);
  for (let v = a; v <= b; v++) {
    if (shouldOwn) set.add(v);
    else set.delete(v);
  }
  draftBook.owned = Array.from(set).sort((x, y) => x - y);
}

function renderDetailBody() {
  const body = document.getElementById("detailBody");
  const prevScroll = body.scrollTop;
  const ownedSet = new Set(draftBook.owned || []);
  const mainOwnedCount = getMainOwnedCount(draftBook);
  const missingCount = getMissingMainCount(draftBook);
  const totalOwnedCount = getTotalOwnedCount(draftBook);
  const derived = getDerivedStatus(draftBook);
  const missingText = formatMissingRanges(draftBook);
  const currentCustomVols = Number(draftBook.customUnitVols) || 0;
  const unitPrice = getUnitPrice(draftBook, currentCustomVols);

  const showDerivedBadge = derived === "未購入" || derived === "コンプ" || derived === "既刊まで所持";
  let derivedClass = "tag-owned-complete";
  if (derived === "未購入") derivedClass = "tag-owned-unstarted";
  else if (derived === "既刊まで所持") derivedClass = "tag-owned-uptodate";
  const derivedBadge = showDerivedBadge
    ? `<span class="tag ${derivedClass}">${escapeHtml(derived)}</span>`
    : "";

  const maxGridVol = Math.min(MAX_VOL, Math.max(0, Number(draftBook.latest) || 0));
  let tilesHtml = "";
  for (let v = 1; v <= maxGridVol; v++) {
    const isOwned = ownedSet.has(v);
    tilesHtml += `<div class="vol-tile ${isOwned ? "owned" : "missing"}" data-vol="${v}">${v}</div>`;
  }

  let vol0SectionHtml = "";
  if (draftBook.hasVol0) {
    vol0SectionHtml = `
      <div class="extra-card">
        <div class="extra-card-head">
          <div>
            <div class="extra-card-title">0巻</div>
            <div class="extra-card-sub">タップで所持/未所持を切替</div>
          </div>
          <button type="button" class="sub-action-btn danger-sm" id="removeVol0Btn">0巻を削除</button>
        </div>
        <div class="vol-grid" style="margin-top:10px;">
          <div class="vol-tile vol0-tile ${draftBook.vol0Owned ? "owned" : "missing"}" id="vol0TileBtn">0巻</div>
        </div>
      </div>
    `;
  } else {
    vol0SectionHtml = `
      <div class="extra-card">
        <div class="extra-card-head">
          <div>
            <div class="extra-card-title">0巻の追加</div>
            <div class="extra-card-sub">0巻がある作品だけ追加できます</div>
          </div>
          <button type="button" class="sub-action-btn purple" id="addVol0Btn">＋ 0巻を追加</button>
        </div>
      </div>
    `;
  }

  const spinTotal = Number(draftBook.spinoffTotal) || 0;
  const spinOwnedSet = new Set(draftBook.spinoffOwned || []);
  let spinTilesHtml = "";
  for (let s = 1; s <= spinTotal; s++) {
    const isSpinOwned = spinOwnedSet.has(s);
    spinTilesHtml += `<div class="vol-tile spin-tile ${isSpinOwned ? "owned" : "missing"}" data-spin="${s}">外${s}</div>`;
  }

  const spinoffSectionHtml = `
    <div class="extra-card">
      <div class="extra-card-head">
        <div>
          <div class="extra-card-title">番外編</div>
          <div class="extra-card-sub">巻数を設定すると各巻をタップで管理できます</div>
        </div>
        <div class="stepper-wrap">
          <button type="button" class="stepper-btn" id="spinMinusBtn">－</button>
          <input type="number" id="editSpinTotal" class="range-num" style="width:58px; height:40px;" min="0" max="100" value="${spinTotal}" />
          <button type="button" class="stepper-btn" id="spinPlusBtn">＋</button>
        </div>
      </div>
      ${spinTotal > 0 ? `
        <div class="vol-section-header" style="margin-top:10px;">
          <span>番外編 所持：${getSpinoffOwnedCount(draftBook)} / ${spinTotal}巻</span>
          <span>外1〜外${spinTotal}</span>
        </div>
        <div class="vol-grid">${spinTilesHtml}</div>
      ` : ""}
    </div>
  `;

  const coverBoxContent = draftCoverDataUrl
    ? `<img src="${draftCoverDataUrl}" alt="表紙" />`
    : `<span>画像</span><span>未設定</span>`;

  const yomiControlHtml = yomiInputOpen
    ? `<input type="text" id="editYomi" class="inline-yomi-input" value="${escapeHtml(draftBook.yomi)}" placeholder="" />`
    : `<button type="button" id="yomiTriggerBtn" class="yomi-trigger-btn ${draftBook.yomi ? "has-value" : ""}">読みがな</button>`;

  body.innerHTML = `
    <div class="field-group">
      <div class="detail-top-row">
        <div class="cover-col ${draftCoverDataUrl && showCoverRemoveBadge ? "show-remove" : ""}" id="coverCol">
          <input type="file" id="coverFileInput" accept="image/*" style="display:none;" />
          <div class="cover-tap-box" id="coverTapBox" title="タップして画像を選択">${coverBoxContent}</div>
          ${draftCoverDataUrl ? `<button type="button" class="cover-remove-badge" id="removeCoverBtn" title="画像を削除" aria-label="画像を削除">✕</button>` : ""}
        </div>
        <div class="detail-title-pub-col">
          <div class="field-row" style="margin-bottom:0;">
            <div class="title-yomi-inline">
              <label class="field-label">タイトル</label>
              <div class="inline-yomi-group">
                ${yomiControlHtml}
              </div>
            </div>
            <input type="text" id="editTitle" class="text-input" value="${escapeHtml(draftBook.title)}" placeholder="" />
          </div>
          <div class="field-row-2col" style="margin-bottom:0;">
            <div class="field-row" style="margin-bottom:0;">
              <label class="field-label">出版社</label>
              <input type="text" id="editPublisher" class="text-input" value="${escapeHtml(draftBook.publisher)}" placeholder="" />
            </div>
            <div class="field-row" style="margin-bottom:0;">
              <label class="field-label">雑誌・レーベル</label>
              <input type="text" id="editMagazine" class="text-input" value="${escapeHtml(draftBook.magazine)}" placeholder="" />
            </div>
          </div>
        </div>
      </div>
      <div class="field-row-2col">
        <div class="field-row">
          <label class="field-label">状態</label>
          <select id="editStatus" class="text-input" style="height:42px;">
            <option value="連載中" ${draftBook.status === "連載中" ? "selected" : ""}>連載中</option>
            <option value="完結" ${draftBook.status === "完結" ? "selected" : ""}>完結</option>
          </select>
        </div>
        <div class="field-row">
          <label class="field-label">既刊数</label>
          <div class="stepper-wrap">
            <button type="button" class="stepper-btn" id="latestMinusBtn">－</button>
            <input type="number" id="editLatest" class="text-input" min="0" max="${MAX_VOL}" value="${draftBook.latest}" style="text-align:center; font-weight:800;" />
            <button type="button" class="stepper-btn" id="latestPlusBtn">＋</button>
          </div>
        </div>
      </div>
      <div class="field-row">
        <label class="field-label">金額</label>
        <div class="price-single-row">
          <input type="number" id="editPrice" class="text-input" min="0" step="1" value="${Number(draftBook.price) || 0}" placeholder="" />
          <div class="price-calc-inline">
            <span>指定巻数</span>
            <input type="number" id="customUnitVolsInput" class="custom-vol-input" min="1" max="${MAX_VOL}" value="${currentCustomVols > 0 ? currentCustomVols : ""}" placeholder="" />
            <span>冊</span>
            <span id="detailUnitPriceBadge" style="color:#6ee7b7; font-weight:800; margin-left:2px;">${unitPrice > 0 ? `¥${unitPrice.toLocaleString()}/冊` : ""}</span>
          </div>
        </div>
      </div>
      <div class="field-row">
        <label class="field-label">メモ</label>
        <textarea id="editMemo" class="textarea-input" placeholder="">${escapeHtml(draftBook.memo || "")}</textarea>
      </div>
    </div>

    <div class="detail-status-card">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;">
        <div>
          ${derivedBadge}
          <strong style="${showDerivedBadge ? "margin-left:6px;" : ""} font-size:15px;">既刊${draftBook.latest}巻 / 所持${mainOwnedCount}巻</strong>
          ${missingCount > 0 ? `<span class="book-rem-inline">あと${missingCount}冊</span>` : ""}
        </div>
        <span style="font-size:12px; color:var(--text-sub); font-weight:700;">合計所持：${totalOwnedCount}冊</span>
      </div>
      ${missingText ? `<div class="book-missing-line" style="margin-top:8px;">未所持：${escapeHtml(missingText)}</div>` : ""}
      <div class="quick-btn-row">
        <button type="button" class="quick-btn all-on" id="ownAllBtn">既刊まで一括所持</button>
        <button type="button" class="quick-btn all-off" id="clearAllBtn">すべて未所持</button>
      </div>
      <div class="batch-box">
        <div class="batch-title">範囲指定でまとめて所持 / 未所持</div>
        <div class="range-inputs">
          <input type="number" id="rangeFrom" class="range-num" min="1" max="${Math.max(1, maxGridVol)}" value="1" />
          <span class="range-sep">巻 ～</span>
          <input type="number" id="rangeTo" class="range-num" min="1" max="${Math.max(1, maxGridVol)}" value="${Math.max(1, maxGridVol)}" />
          <span class="range-sep">巻</span>
        </div>
        <div class="quick-btn-row" style="margin-top:0;">
          <button type="button" class="quick-btn all-on" id="applyRangeOnBtn">所持</button>
          <button type="button" class="quick-btn all-off" id="applyRangeOffBtn">未所持</button>
        </div>
      </div>
    </div>

    <div class="vol-section-header">
      <span>各巻の所持状況</span>
    </div>
    <div class="vol-grid" id="volGrid">${tilesHtml}</div>

    ${vol0SectionHtml}
    ${spinoffSectionHtml}

    ${editingBookId !== null ? `<button type="button" class="danger-btn" id="deleteBookBtn">この作品を本棚から削除</button>` : ""}
  `;

  body.scrollTop = prevScroll;

  function refreshDetailPriceDisplays() {
    const u = getUnitPrice(draftBook, Number(draftBook.customUnitVols) || 0);
    const badge = document.getElementById("detailUnitPriceBadge");
    if (badge) badge.textContent = u > 0 ? `¥${u.toLocaleString()}/冊` : "";
  }

  // Yomi toggle input
  const yomiTriggerBtn = document.getElementById("yomiTriggerBtn");
  if (yomiTriggerBtn) {
    yomiTriggerBtn.addEventListener("click", () => {
      yomiInputOpen = true;
      renderDetailBody();
      const inp = document.getElementById("editYomi");
      if (inp) inp.focus();
    });
  }

  const editYomiInput = document.getElementById("editYomi");
  if (editYomiInput) {
    editYomiInput.addEventListener("input", e => {
      draftBook.yomi = e.target.value;
      autoSaveDraftIfExisting();
    });
    editYomiInput.addEventListener("blur", () => {
      yomiInputOpen = false;
      renderDetailBody();
    });
  }

  // Cover Tap Events
  const coverFileInput = document.getElementById("coverFileInput");
  document.getElementById("coverTapBox").addEventListener("click", e => {
    e.stopPropagation();
    if (draftCoverDataUrl) {
      showCoverRemoveBadge = !showCoverRemoveBadge;
      const col = document.getElementById("coverCol");
      if (col) col.classList.toggle("show-remove", showCoverRemoveBadge);
    } else {
      coverFileInput.click();
    }
  });

  coverFileInput.addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const compressedUrl = await compressImageFile(file);
      draftCoverDataUrl = compressedUrl;
      showCoverRemoveBadge = false;
      if (editingBookId !== null) {
        await saveCoverToDb(editingBookId, compressedUrl);
        renderList();
      }
      renderDetailBody();
    } catch (err) {
      alert("画像の読み込みに失敗しました。");
    }
    e.target.value = "";
  });

  const removeCoverBtn = document.getElementById("removeCoverBtn");
  if (removeCoverBtn) {
    removeCoverBtn.addEventListener("click", async e => {
      e.stopPropagation();
      draftCoverDataUrl = null;
      showCoverRemoveBadge = false;
      if (editingBookId !== null) {
        await saveCoverToDb(editingBookId, null);
        renderList();
      }
      renderDetailBody();
    });
  }

  document.getElementById("editTitle").addEventListener("input", e => {
    draftBook.title = e.target.value;
    document.getElementById("detailHeaderTitle").textContent = draftBook.title || "作品詳細";
    if (draftBook.title.trim()) autoSaveDraftIfExisting();
  });

  document.getElementById("editPublisher").addEventListener("input", e => {
    draftBook.publisher = e.target.value;
    autoSaveDraftIfExisting();
  });

  document.getElementById("editMagazine").addEventListener("input", e => {
    draftBook.magazine = e.target.value;
    autoSaveDraftIfExisting();
  });

  document.getElementById("editStatus").addEventListener("change", e => {
    draftBook.status = e.target.value;
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("editLatest").addEventListener("change", e => {
    let val = parseInt(e.target.value, 10);
    if (isNaN(val) || val < 0) val = 0;
    if (val > MAX_VOL) val = MAX_VOL;
    draftBook.latest = val;
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("editPrice").addEventListener("input", e => {
    let val = parseInt(e.target.value, 10);
    if (isNaN(val) || val < 0) val = 0;
    draftBook.price = val;
    refreshDetailPriceDisplays();
    autoSaveDraftIfExisting();
  });

  document.getElementById("customUnitVolsInput").addEventListener("input", e => {
    let val = parseInt(e.target.value, 10);
    if (isNaN(val) || val <= 0) draftBook.customUnitVols = 0;
    else draftBook.customUnitVols = Math.min(MAX_VOL, val);
    refreshDetailPriceDisplays();
    autoSaveDraftIfExisting();
  });

  document.getElementById("editMemo").addEventListener("input", e => {
    draftBook.memo = e.target.value;
    autoSaveDraftIfExisting();
  });

  document.getElementById("latestMinusBtn").addEventListener("click", () => {
    draftBook.latest = Math.max(0, (Number(draftBook.latest) || 0) - 1);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("latestPlusBtn").addEventListener("click", () => {
    draftBook.latest = Math.min(MAX_VOL, (Number(draftBook.latest) || 0) + 1);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("ownAllBtn").addEventListener("click", () => {
    const all = [];
    for (let v = 1; v <= draftBook.latest; v++) all.push(v);
    draftBook.owned = all;
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("clearAllBtn").addEventListener("click", () => {
    draftBook.owned = [];
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("applyRangeOnBtn").addEventListener("click", () => {
    const f = document.getElementById("rangeFrom").value;
    const t = document.getElementById("rangeTo").value;
    applyRangeOwned(f, t, true);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("applyRangeOffBtn").addEventListener("click", () => {
    const f = document.getElementById("rangeFrom").value;
    const t = document.getElementById("rangeTo").value;
    applyRangeOwned(f, t, false);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  body.querySelectorAll(".vol-tile[data-vol]").forEach(tile => {
    tile.addEventListener("click", () => {
      const vol = Number(tile.getAttribute("data-vol"));
      const set = new Set(draftBook.owned || []);
      if (set.has(vol)) set.delete(vol);
      else set.add(vol);
      draftBook.owned = Array.from(set).sort((a, b) => a - b);
      autoSaveDraftIfExisting();
      renderDetailBody();
    });
  });

  const addVol0Btn = document.getElementById("addVol0Btn");
  if (addVol0Btn) {
    addVol0Btn.addEventListener("click", () => {
      draftBook.hasVol0 = true;
      draftBook.vol0Owned = true;
      autoSaveDraftIfExisting();
      renderDetailBody();
    });
  }

  const removeVol0Btn = document.getElementById("removeVol0Btn");
  if (removeVol0Btn) {
    removeVol0Btn.addEventListener("click", () => {
      draftBook.hasVol0 = false;
      draftBook.vol0Owned = false;
      autoSaveDraftIfExisting();
      renderDetailBody();
    });
  }

  const vol0TileBtn = document.getElementById("vol0TileBtn");
  if (vol0TileBtn) {
    vol0TileBtn.addEventListener("click", () => {
      draftBook.vol0Owned = !draftBook.vol0Owned;
      autoSaveDraftIfExisting();
      renderDetailBody();
    });
  }

  document.getElementById("editSpinTotal").addEventListener("change", e => {
    let val = parseInt(e.target.value, 10);
    if (isNaN(val) || val < 0) val = 0;
    if (val > 100) val = 100;
    draftBook.spinoffTotal = val;
    draftBook.spinoffOwned = (draftBook.spinoffOwned || []).filter(v => v <= val);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("spinMinusBtn").addEventListener("click", () => {
    const nextVal = Math.max(0, (Number(draftBook.spinoffTotal) || 0) - 1);
    draftBook.spinoffTotal = nextVal;
    draftBook.spinoffOwned = (draftBook.spinoffOwned || []).filter(v => v <= nextVal);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  document.getElementById("spinPlusBtn").addEventListener("click", () => {
    const nextVal = Math.min(100, (Number(draftBook.spinoffTotal) || 0) + 1);
    draftBook.spinoffTotal = nextVal;
    draftBook.spinoffOwned = (draftBook.spinoffOwned || []).filter(v => v <= nextVal);
    autoSaveDraftIfExisting();
    renderDetailBody();
  });

  body.querySelectorAll(".vol-tile[data-spin]").forEach(tile => {
    tile.addEventListener("click", () => {
      const sVol = Number(tile.getAttribute("data-spin"));
      const set = new Set(draftBook.spinoffOwned || []);
      if (set.has(sVol)) set.delete(sVol);
      else set.add(sVol);
      draftBook.spinoffOwned = Array.from(set).sort((a, b) => a - b);
      autoSaveDraftIfExisting();
      renderDetailBody();
    });
  });

  const delBtn = document.getElementById("deleteBookBtn");
  if (delBtn) {
    delBtn.addEventListener("click", async () => {
      if (confirm(`本当に「${draftBook.title}」を本棚から削除しますか？`)) {
        const targetId = editingBookId;
        books = books.filter(b => b.id !== targetId);
        shoppingSelections.delete(targetId);
        calcSelectedIds.delete(targetId);
        await saveCoverToDb(targetId, null);
        saveBooks(books);
        refreshPubFilterOptions();
        closeDetailModal();
        renderList();
      }
    });
  }
}

function closeDetailModal() {
  document.getElementById("detailModal").classList.remove("open");
  document.body.classList.remove("modal-open");
  editingBookId = null;
  draftBook = null;
  draftCoverDataUrl = null;
  showCoverRemoveBadge = false;
  yomiInputOpen = false;
}

document.getElementById("closeDetailBtn").addEventListener("click", closeDetailModal);

document.getElementById("detailModal").addEventListener("click", e => {
  if (e.target.id === "detailModal") closeDetailModal();
});

document.getElementById("saveDetailBtn").addEventListener("click", async () => {
  if (!draftBook) return;
  if (!draftBook.title.trim()) {
    alert("タイトルを入力してください。");
    return;
  }
  draftBook = normalizeBook({
    ...draftBook,
    title: draftBook.title.trim(),
    yomi: (draftBook.yomi || "").trim(),
    publisher: (draftBook.publisher || "").trim(),
    magazine: (draftBook.magazine || "").trim(),
    memo: (draftBook.memo || "").trim(),
    price: Math.max(0, Math.floor(Number(draftBook.price) || 0)),
    customUnitVols: Math.min(MAX_VOL, Math.max(0, Math.floor(Number(draftBook.customUnitVols) || 0)))
  });
  if (editingBookId === null) {
    books.push(draftBook);
  } else {
    const idx = books.findIndex(b => b.id === editingBookId);
    if (idx !== -1) books[idx] = draftBook;
  }
  await saveCoverToDb(draftBook.id, draftCoverDataUrl);
  saveBooks(books);
  refreshPubFilterOptions();
  closeDetailModal();
  renderList();
});

// Search, Sort, PubFilter, Filter, Kana events
const searchInput = document.getElementById("searchInput");
const searchClearBtn = document.getElementById("searchClearBtn");
searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value;
  searchClearBtn.classList.toggle("visible", searchQuery.length > 0);
  renderList();
});
searchClearBtn.addEventListener("click", () => {
  searchQuery = "";
  searchInput.value = "";
  searchClearBtn.classList.remove("visible");
  renderList();
});
document.getElementById("sortSelect").addEventListener("change", e => {
  currentSort = e.target.value;
  renderList();
});
document.getElementById("pubFilterSelect").addEventListener("change", e => {
  currentPubFilter = e.target.value;
  renderList();
});
document.getElementById("filterChips").querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.getElementById("filterChips").querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentFilter = chip.getAttribute("data-filter");
    renderList();
  });
});
document.getElementById("kanaChips").querySelectorAll(".kana-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const kana = chip.getAttribute("data-kana");
    if (currentKana === kana) {
      currentKana = null;
      currentChar = null;
      chip.classList.remove("active");
    } else {
      document.getElementById("kanaChips").querySelectorAll(".kana-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentKana = kana;
      currentChar = null;
    }
    renderSubKanaRow();
    renderList();
  });
});

document.getElementById("addBookBtn").addEventListener("click", () => openDetailModal(null));

// Backup modal
document.getElementById("openBackupBtn").addEventListener("click", () => {
  document.getElementById("backupModal").classList.add("open");
  document.body.classList.add("modal-open");
});
document.getElementById("closeBackupBtn").addEventListener("click", () => {
  document.getElementById("backupModal").classList.remove("open");
  document.body.classList.remove("modal-open");
});
document.getElementById("backupModal").addEventListener("click", e => {
  if (e.target.id === "backupModal") {
    document.getElementById("backupModal").classList.remove("open");
    document.body.classList.remove("modal-open");
  }
});
document.getElementById("exportJsonBtn").addEventListener("click", () => {
  const exportData = books.map(b => {
    const c = coverMap.get(Number(b.id));
    return c ? { ...b, cover: c } : { ...b };
  });
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `manga_shelf_backup_${dateStr}.json`;
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById("importJsonBtn").addEventListener("click", () => {
  document.getElementById("importJsonInput").click();
});
document.getElementById("importJsonInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) throw new Error("Invalid format");
      await clearAllCoversFromDb();
      const normalizedList = [];
      for (const rawItem of imported) {
        const nb = normalizeBook(rawItem);
        normalizedList.push(nb);
        if (typeof rawItem.cover === "string" && rawItem.cover.startsWith("data:image/")) {
          await saveCoverToDb(nb.id, rawItem.cover);
        }
      }
      books = normalizedList;
      shoppingSelections.clear();
      calcSelectedIds.clear();
      saveBooks(books);
      refreshPubFilterOptions();
      renderList();
      document.getElementById("backupModal").classList.remove("open");
      document.body.classList.remove("modal-open");
      alert(`${books.length}作品のデータを復元しました。`);
    } catch (err) {
      alert("ファイルの読み込みに失敗しました。正しいバックアップファイルか確認してください。");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

// Initial boot
(async function initApp() {
  await loadAllCoversFromDb();
  refreshPubFilterOptions();
  renderList();
})();
</script>
